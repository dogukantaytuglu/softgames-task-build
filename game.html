<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Softgames Assignment</title>
    <style>
      /*
        This page owns Unity's canvas and nothing else - it's loaded inside an iframe
        from index.html, which is the thing that actually sizes the box this page fills
        (see index.html's #unity-frame-wrapper for why). Isolating Unity's own resize
        handling (matchWebGLToCanvasSize) behind a real document/iframe boundary is
        deliberate (2026-08-29): two earlier attempts at fixing a canvas-resize
        RangeError (Maximum call stack size exceeded, reproduced on a real iPhone) by
        adjusting CSS/DOM structure *within the same document* as the outer page's own
        resize/viewport-height logic both failed. An iframe's own html/body just fills
        whatever box its parent gives it - nothing in here can feed back into that box's
        size, which a same-document fix can't fully guarantee.
      */
      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #181327;
      }

      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #181327;
        touch-action: none;
      }

      #unity-loading {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #181327;
        transition: opacity 240ms ease;
      }

      #unity-loading.hidden {
        opacity: 0;
        pointer-events: none;
      }

      #unity-loading-title {
        font-size: clamp(18px, 4vw, 28px);
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #fff5d9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #unity-progress-track {
        width: min(280px, 60vw);
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 245, 217, 0.16);
        overflow: hidden;
      }

      #unity-progress-fill {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: #fff5d9;
        transition: width 120ms linear;
      }

      #unity-loading-hint {
        font-size: 13px;
        opacity: 0.55;
        letter-spacing: 0.02em;
        color: #fff5d9;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      #unity-warning {
        position: fixed;
        left: 50%;
        top: 16px;
        transform: translateX(-50%);
        z-index: 10;
        max-width: min(560px, 90vw);
      }

      #unity-warning > div {
        margin-bottom: 8px;
        padding: 10px 14px;
        border-radius: 8px;
        font-size: 14px;
        line-height: 1.4;
        color: #2a2140;
      }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" width="1080" height="1920" tabindex="-1"></canvas>

    <div id="unity-loading">
      <div id="unity-loading-title">Softgames Assignment</div>
      <div id="unity-progress-track"><div id="unity-progress-fill"></div></div>
      <div id="unity-loading-hint">Loading…</div>
    </div>

    <div id="unity-warning"></div>

    <script>
      var canvas = document.querySelector("#unity-canvas");
      var loading = document.querySelector("#unity-loading");
      var progressFill = document.querySelector("#unity-progress-fill");
      var loadingHint = document.querySelector("#unity-loading-hint");

      // Unity's own WebGL runtime keeps the render buffer synced to the canvas's CSS
      // size via matchWebGLToCanvasSize (on by default). No custom resize code here on
      // purpose - see the top-of-file comment for why that was the whole point of this
      // page existing separately from index.html.

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == "error") {
          div.style.background = "#ff6b6b";
        } else {
          if (type == "warning") div.style.background = "#ffd166";
          setTimeout(function () {
            if (div.parentNode) warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/softgames-task-build.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/softgames-task-build.data.unityweb",
        frameworkUrl: buildUrl + "/softgames-task-build.framework.js.unityweb",
        codeUrl: buildUrl + "/softgames-task-build.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Dogukan Taytuglu",
        productName: "Softgames Assignment",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressFill.style.width = 100 * progress + "%";
        })
          .then(() => {
            loading.classList.add("hidden");
            setTimeout(() => { loading.style.display = "none"; }, 260);
          })
          .catch((message) => {
            loadingHint.textContent = message;
            loadingHint.style.opacity = "1";
            unityShowBanner(message, "error");
          });
      };
      script.onerror = () => {
        loadingHint.textContent = "Could not load the game files.";
        loadingHint.style.opacity = "1";
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
